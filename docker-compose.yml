services:
  sdk:
    build:
      context: .
      cache_from:
        - ${IMAGE}:branchx-${CLEAN_BRANCH}
        - ${IMAGE}:latest
    working_dir: /app
    volumes:
      - .:/app
      - /usr/bin/buildkite-agent:/usr/bin/buildkite-agent
    environment:
      - BUILDKITE_AGENT_ACCESS_TOKEN
      - BUILDKITE_JOB_ID
      - BUILDKITE_BUILD_ID
      - BUILDKITE_BUILD_NUMBER
